# Body Pi time sync — install as /etc/chrony/conf.d/body.conf (see deploy/NETWORK.md "Time sync").
#
# The Pi 5 has no RTC battery: it boots with a stale clock and (with the default
# timesyncd) can step its wall clock minutes into a session. body/** messages
# carry wall-clock `ts` that the desktop compares with its own clock, so:
#   * sync to the operator desktop on the bot subnet (works with no internet);
#   * fall back to the public pool when there is internet;
#   * step only during the first few updates after boot, slew afterwards.
server 192.168.8.60 iburst minpoll 4 maxpoll 6 prefer
pool 2.debian.pool.ntp.org iburst maxsources 2

# Step if off by > 0.5 s, but only in the first 3 updates (boot). Afterwards
# chrony slews, so running processes never see a backward/forward jump.
makestep 0.5 3

# Keep the system clock's last good value across reboots (no RTC).
driftfile /var/lib/chrony/chrony.drift
rtcsync
